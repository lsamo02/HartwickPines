
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>Hartwick Pines State Park</title>

        <script>
        var esriConfig = {
            apiKey: "AAPTxy8BH1VEsoebNVZXo8HurOxCJM2SBFdn7xcvT1L38mvM8JqyGgY9I6ZreW_-CskCtSMLy6RPqSw4kVdzsBThhN8nICK_1mCJwa8lucTs48AdUfCJtFo68KbSaDBUiDMf-LWzMaK2YYnfUifnJZ75EIyK_JiaH-D3QuQdxjQ4xqpGYCoVbCxDgbhiI9vdUgebxmlgBeq85B5nVr07VkiU-KOKlKWT-3hcQSjuO0L3T94rpV3jgK2cx5Qryr-Q9xCEAT1_leRAI5yG",
        };
        </script>

        <script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"></script>


        <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
        <script src="https://js.arcgis.com/4.34/"></script>

        <script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>

        <!--styling the page-->
        <style>
            html,
            body,
            #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
            }
        </style>

    </head>

    <body>

        <arcgis-map basemap= "satellite" center = "-84.67554701694672, 44.749945182717525" zoom= "14">
            <arcgis-expand
                slot="top-left"
                mode="floating"
            >
                <arcgis-search
                all-placeholder= "Accessible Features"
                include-default-sources-disabled></arcgis-search>
            </arcgis-expand>
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <arcgis-locate slot= "top-left"></arcgis-locate>
            <arcgis-expand
                slot="bottom-left" 
                mode="floating"
            >
                <arcgis-legend></arcgis-legend>
            </arcgis-expand>
            <arcgis-expand
                slot="bottom-right" 
                mode="floating"
            >
                <arcgis-editor></arcgis-editor>
            </arcgis-expand>
            <arcgis-expand
                slot= "top-right"
                mode= "floating"
            >
                <arcgis-layer-list></arcgis-layer-list>
            </arcgis-expand>

        </arcgis-map>

        <script type="module">
            const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
            
            const PictureMarkerSymbol = await $arcgis.import("@arcgis/core/symbols/PictureMarkerSymbol.js");

            const viewElement = document.querySelector("arcgis-map");
            await viewElement.viewOnReady();

            const accessibilityNote = new FeatureLayer({
                url:"https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Accessibility_Note/FeatureServer",
                popupTemplate:{
                    title:"Accessibility Note",  
                    content: "<b>Date Added:</b> {Date}"+ "<br><b>Note:</b> {Note}", 
                    overwriteActions: true
                }


            })

            viewElement.map.add(accessibilityNote); 

            // Define a simple renderer and symbol
            const trailheadsRenderer = {
                type: "simple",
                symbol: {
                type: "picture-marker",
                url: "http://static.arcgis.com/images/Symbols/NPS/npsPictograph_0231b.png",
                width: "18px",
                height: "18px",
                },
            };

            // Define a label for the trailheads
            const trailheadsLabels = {
                symbol: {
                type: "text",
                color: "#FFFFFF",
                haloColor: "#5E8D74",
                haloSize: "2px",
                font: {
                    size: "12px",
                    family: "Noto Sans",
                    style: "italic",
                    weight: "normal",
                },
                },

                labelPlacement: "above-center",
                labelExpressionInfo: {
                expression: "$feature.label",
                },
            };

            // Create the layer and set the renderer
            const trailheads = new FeatureLayer({
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Hartwick_TrailsInfo/FeatureServer",
                renderer: trailheadsRenderer,
                labelingInfo: [trailheadsLabels],
                popupTemplate:{
                    title:"{Label}",  
                    content: "<b>Accessible:</b> {Accessible}"+ "<br><b>Length:</b> {Trail_Length_mi} miles", 
                    overwriteActions: true
                }
            });

            viewElement.map.add(trailheads, 1);


            // Define a unique value renderer and symbols
            const activitiesRenderer = {
                type: "unique-value",
                field: "Label",
                
                uniqueValueInfos: [{
                    value: "Campground",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Campground.png",
                    width: "50px",
                    height: "50px"
                    },
                },
                {
                    value: "Access Site and Fishing Pier",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Fishing%20Pier.png",
                    width: "50px",
                    height: "50px"
                    },
                }, 
                {
                    value: "Rustic Cabin",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Cabin.png",
                    width: "50px",
                    height: "50px"
                    },
                }, 
                {
                    value: " Group Campground",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Campground.png",
                    width: "50px",
                    height: "50px"
                    },
                },
                {
                    value: "Picnic Shelter",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Picnic%20shelter.png",
                    width: "50px",
                    height: "50px"
                    },
                },
                {
                    value: "Parking",
                    symbol: {
                    type: "picture-marker",
                    url: "https://cdn.arcgis.com/sharing/rest/content/items/36359a4a8f3143b6bf44d5688e007900/resources/styles/thumbnails/Parking%20lot.png",
                    width: "50px",
                    height: "50px"
                    },
                }
                ]
            
            };


            // Create the layer and set the renderer
            const activities = new FeatureLayer({
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Hartwick_Amenities_Activities/FeatureServer",
                renderer: activitiesRenderer,
                popupTemplate:{
                    title:"{Label}",  
                    content: "<b>Accessible:</b> {Accessible}", 
                    overwriteActions: true, 
                }
            });

            viewElement.map.add(activities, 1);


            // Define a unique value renderer and symbols
            const trailsRenderer = {
                type: "unique-value",
                field: "Accessible",
                uniqueValueInfos: [{
                    value: "Yes",
                    symbol: {
                    color: "#b5651d",
                    type: "simple-line",
                    style: "solid",
                    width: "2px", 
                    },
                },
                {
                    value: "No",
                    symbol: {
                    color: "#b5651d",
                    type: "simple-line",
                    style: "short-dot",
                    width: "2px", 
                    },
                }]
            
            };

            // Create the layer and set the renderer
            const trails = new FeatureLayer({
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Hartwick_trails/FeatureServer",
                renderer: trailsRenderer,
                opacity: 0.75,
                popupTemplate:{
                    title:"{Trail_Name}",  
                    content: "<b>Accessible:</b> {Accessible}"+ "<br><b>Length:</b>{Miles} miles"+"<br><b>Bikes Allowed:</b> {Bike_Use}"+"<br><b>Cross Country Ski Allowed:</b> {XCountrySki_Use}"
                    +"<br><b>Snow Shoe Allowed:</b> {SnowShoe_Use}"+"<br><b>Paved:</b> {Paved}", 
                    overwriteActions: true
                }
            });

            viewElement.map.add(trails, 0);

            // Add roads
            const roadsRenderer = {
                type: "simple",
                symbol: {
                type: "simple-line",
                style: "solid",
                color: "#808080",
                width: "1px",
                },
            };

            const roads = new FeatureLayer({
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/DNR_PublicRds/FeatureServer",
                renderer: roadsRenderer,
            });

            viewElement.map.add(roads, 0);

            //renderer for Park Buildings
            const buildingRenderer = {
                type: "simple",  // autocasts as new SimpleRenderer()
                symbol: {
                    type: "simple-fill",  // autocasts as new SimpleMarkerSymbol()
                    color: [
                            193,
                            167,
                            137,
                            255
                    ],
                    outline: {  
                    width: 1,
                    color: "#523c21"
                    }
                }
            };

        
            // Create park bounary layer from feature service 
            const buildings = new FeatureLayer({ 
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Hartwick_Buildings/FeatureServer", 
                renderer: buildingRenderer,
                popupTemplate:{
                    title:"{Label}",  
                    content: "<b>Accessible:</b> {Accessible}",
                    overwriteActions: true
                }
               
            });
            
            //adds park layer to map
            viewElement.map.add(buildings, 0);

            //renderer for Park Boundary
            const parkRenderer = {
                type: "simple",  // autocasts as new SimpleRenderer()
                symbol: {
                    type: "simple-fill",  // autocasts as new SimpleMarkerSymbol()
                    // color: "purple",
                    outline: {  
                    width: 3,
                    color: "black"
                    }
                }
            };

        
            // Create park bounary layer from feature service 
            const parkLayer = new FeatureLayer({ 
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/HartwickPinesBoundary/FeatureServer", //URL to Hartwick Pines State Park layer
                renderer: parkRenderer,
               
            });
            
            //adds park layer to map
            viewElement.map.add(parkLayer, 0);

            // creates search constant 
            const search= document.querySelector("arcgis-search"); 
            await search.componentOnReady();

            search.sources= [
                {
                    layer: buildings, 
                    searchFields: ["Label"], 
                    displayField: "Accessible",
                    exactMatch: false, 
                    outFields: ["Label", "Accessible"], 
                    name: "Park Buildings", 
                    placeholder: "example: Visitor Center",
                }, 
                {
                    layer: trails, 
                    searchFields: ["Label"], 
                    displayField: "Accessible",
                    exactMatch: false, 
                    outFields: ["Label", "Accessible"], 
                    name: "Trails", 
                    placeholder: "example: Weary Leg Trail",
                },
                {
                    layer:activities, 
                    searchFields: ["Label"], 
                    displayField: "Accessible",
                    exactMatch: false, 
                    outFields: ["Label", "Accessible"], 
                    name: "Amenities", 
                    placeholder: "example: Campground",
                }, 
                {
                    name: "ArcGIS World Geocoding Service",
                    placeholder: "example: Grayling, MI",
                    singleLineFieldName: "SingleLine",
                    apiKey: "AAPTxy8BH1VEsoebNVZXo8HurOxCJM2SBFdn7xcvT1L38mvM8JqyGgY9I6ZreW_-CskCtSMLy6RPqSw4kVdzsBThhN8nICK_1mCJwa8lucTs48AdUfCJtFo68KbSaDBUiDMf-LWzMaK2YYnfUifnJZ75EIyK_JiaH-D3QuQdxjQ4xqpGYCoVbCxDgbhiI9vdUgebxmlgBeq85B5nVr07VkiU-KOKlKWT-3hcQSjuO0L3T94rpV3jgK2cx5Qryr-Q9xCEAT1_leRAI5yG",
                    url: "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer",
                }

            ];
            

        </script>
       
    </body>
</html>
