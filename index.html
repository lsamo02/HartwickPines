<!DOCTYPE html>
 <html>
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />

    <title>Hartwick Pines State Park</title>

    <!--styling the page-->
    <style>
        html,
        body,
        #viewDiv {
         padding: 0;
         margin: 0;
         height: 100%;
         width: 100%;
        }


    </style>

    <!--importing css and libraries for esri.js-->
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
    <script src="https://js.arcgis.com/4.34/"></script>

    <script type="module">
      const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");

    </script>

    <!--loads modules-->
    <script>


        require([ "esri/config", "esri/Map", "esri/views/MapView", "esri/widgets/Search", "esri/widgets/Locate", "esri/layers/FeatureLayer", "esri/widgets/Legend", "esri/widgets/Expand" ], (esriConfig, Map, MapView, Locate, Search, FeatureLayer, Legend, Expand) => {

            esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurOxCJM2SBFdn7xcvT1L38mvM8JqyGgY9I6ZreW_-CskCtSMLy6RPqSw4kVdzsBThhN8nICK_1mCJwa8lucTs48AdUfCJtFo68KbSaDBUiDMf-LWzMaK2YYnfUifnJZ75EIyK_JiaH-D3QuQdxjQ4xqpGYCoVbCxDgbhiI9vdUgebxmlgBeq85B5nVr07VkiU-KOKlKWT-3hcQSjuO0L3T94rpV3jgK2cx5Qryr-Q9xCEAT1_leRAI5yG";
          
            const map = new Map({
                basemap: "satellite" //basemap satellite 
            });

            const view = new MapView({
                container: "viewDiv", // Reference to the DOM node that will contain the view
                    map: map, // References the map object
                    center: [-84.67554701694672, 44.749945182717525], // Longitude, latitude for Hartwick Pines
                    zoom: 13, // Zoom level
                    container: "viewDiv" // Div element
            });

            //creating search widget
            const searchWidget = new Search({
                view: view,
                
            });

            //adds search widget
            view.ui.add(searchWidget, {
                position: "top-left", 
                index: 1
            });

            //created locate button
            const locateBtn = new Locate({
                view: view, 
                container: document.createElement ("div")
            });

            //created expand for locate button
            const locateExpand = new Expand({
                view:view,
                content: locateBtn
            })

            // Add the locate Expand widget 
            view.ui.add(locateExpand, { 
                position: "top-left",
                index:0
                
            });

                        // Define a unique value renderer and symbols
            const trailsRenderer = {
                type: "unique-value",
                field: "ADA",
                uniqueValueInfos: [{
                    value: "1",
                    symbol: {
                    color: "#BA55D3",
                    type: "simple-line",
                    style: "solid",
                    },
                },
                {
                    value: "4",
                    symbol: {
                    color: "#FFA500",
                    type: "simple-line",
                    style: "solid",
                    },
                }]
            
            };

            // Create the layer and set the renderer
            const trails = new FeatureLayer({
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Hartwick_trails/FeatureServer",
                renderer: trailsRenderer,
                opacity: 0.75,
            });

            map.add(trails, 0);

            //renderer for Park Boundary
            const parkRenderer = {
                type: "simple",  // autocasts as new SimpleRenderer()
                symbol: {
                    type: "simple-fill",  // autocasts as new SimpleMarkerSymbol()
                    // color: "purple",
                    outline: {  
                    width: 3,
                    color: "black"
                    }
                }
            };

        
            // Create park bounary layer from feature service 
            const parkLayer = new FeatureLayer({ 
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/HartwickPinesBoundary/FeatureServer", //URL to Hartwick Pines State Park layer
                renderer: parkRenderer,
               
            });
            
            //adds park layer to map
            map.add(parkLayer, 0);
            
    

            //creates legend and updates legend descriptions for layers
            // let legend = new Legend ({
            //     view:view,
            //     layerInfos: [
            //         {
            //             layer:parkLayer,
            //             title: "Hartwick State Park Boundary"
            //         }
            //         ]
            // }); 

            // //created expand for legend
            // const legendExpand = new Expand({
            //     view: view,
            //     content: legend
            // });

            // //adds legend to map
            // view.ui.add (legendExpand, "bottom-left");


        });
     </script>

  </head>
  <body>

    <div id="viewDiv"></div>

  </body>
</html>
