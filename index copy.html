<!DOCTYPE html>
 <html>
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />

    <title>Hartwick Pines State Park</title>

    <!--styling the page-->
    <style>
        html,
        body,
        #viewDiv {
         padding: 0;
         margin: 0;
         height: 100%;
         width: 100%;
        }

        .addRecordBtn {                                     
        position: absolute;
        z-index: 10;
        bottom: 30px;
        right: 10px;
        background-color: #70ae6e;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        }

        .addRecordBtn:hover {
        background-color: #384d48;
        }
    </style>

    <!--importing css and libraries for esri.js-->
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
    <script src="https://js.arcgis.com/4.30/"></script>

    <!--loads modules-->
    <script>
        
        // function safetyAlertFunction(){
            // alert("Keep Wildlife Wild! \nMaintain a safe distance from wildlife when recording your encounter. Learn more at: \nhttps://www.michigan.gov/dnr/managing-resources/wildlife/keep-wild"); 
        // }

        require([ "esri/config", "esri/Map", "esri/views/MapView", "esri/widgets/Search", "esri/widgets/Locate", "esri/layers/FeatureLayer", "esri/widgets/Legend", "esri/widgets/Expand" ], (esriConfig, Map, MapView, Locate, Search, FeatureLayer, Legend, Expand) => {

            esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurOxCJM2SBFdn7xcvT1L38mvM8JqyGgY9I6ZreW_-CskCek5wBVwF7SEueg9kN6l8kkJXzv1l1OMA060-IPeO302BssrSrxYedw9j4tTgXYeam0aL0P3vclOI4HjPaMmO3pQweizFCRuDTWSVP42Vualv70iB8JLH7wMbh4v9QoxW_wZvHni7MCbxYsBO_7lPlXYTEHvezn4AyvYiYeVWFfx-TxXUAoY19Z4ueRRW_UTsAT1_DalpM85W";
          
            const map = new Map({
                basemap: "satellite" //basemap satellite 
            });

            const view = new MapView({
                container: "viewDiv", // Reference to the DOM node that will contain the view
                    map: map, // References the map object
                    center: [-84.67554701694672, 44.749945182717525], // Longitude, latitude for Hartwick Pines
                    zoom: 17, // Zoom level
                    container: "viewDiv" // Div element
            });

            //creating search widget
            const searchWidget = new Search({
                view: view,
                
            });

            //adds search widget
            view.ui.add(searchWidget, {
                position: "top-left", 
                index: 1
            });

            //created locate button
            const locateBtn = new Locate({
                view: view, 
                container: document.createElement ("div")
            });

            //created expand for locate button
            const locateExpand = new Expand({
                view:view,
                content: locateBtn
            })

            // Add the locate Expand widget 
            view.ui.add(locateExpand, {
                position: "top-left",
                index:0
                
            });

        
            // Create park bounary layer from feature service 
            const parkLayer = new FeatureLayer({ 
                url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/HartwickPinesBoundary/FeatureServer", //URL to Hartwick Pines State Park layer
                renderer: rehabRenderer, 
                outFields:["NAME_1", "ORGANIZATION", "City", "TELEPHONE", "SPECIES"],
                popupTemplate: popupRehab
            });
            
            //adds park layer to map
            map.add(parkLayer);
            
    

            //creates legend and updates legend descriptions for layers
            let legend = new Legend ({
                view:view,
                layerInfos: [
                    {
                        layer:parkLayer,
                        title: "Hartwick State Park Boundary"
                    }
                    ]
            }); 

            //created expand for legend
            const legendExpand = new Expand({
                view: view,
                content: legend
            });

            //adds legend to map
            view.ui.add (legendExpand, "bottom-left");


        });
     </script>

  </head>
  <body onload ="safetyAlertFunction()"><!--loads safety alert when opening the app-->

    <div id="viewDiv"></div>

  </body>
</html>
